<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kamu 🤍</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sorot Cahaya Matahari dari Atas/Tengah -->
    <div class="sunbeam-container">
        <div class="sunbeam-core"></div>
        <div class="sunbeam-ray ray-1"></div>
        <div class="sunbeam-ray ray-2"></div>
        <div class="sunbeam-ray ray-3"></div>
    </div>

    <!-- Debu/Partikel Cahaya Melayang -->
    <div class="dust-container" id="dustContainer"></div>

    <main class="main-container">
        <!-- Visual Mawar Putih -->
        <div class="rose-wrapper">
            <svg class="white-rose" viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Batang & Daun -->
                <path class="rose-stem" d="M100 220 Q95 160 100 110" stroke="#2d4a3e" stroke-width="4" stroke-linecap="round"/>
                <path class="rose-leaf leaf-left" d="M98 170 C70 160 60 140 65 130 C80 130 90 148 98 170Z" fill="#1b332b" stroke="#375d4e" stroke-width="1.5"/>
                <path class="rose-leaf leaf-right" d="M102 150 C130 140 140 120 135 110 C120 110 110 128 102 150Z" fill="#1b332b" stroke="#375d4e" stroke-width="1.5"/>
                
                <!-- Kelopak Luar & Dalam Mawar Putih -->
                <g class="rose-petals">
                    <!-- Kelopak Belakang -->
                    <path class="petal opacity-90" d="M100 115 C60 110 45 70 80 50 C100 65 110 95 100 115Z" fill="#f1f5f9" stroke="#cbd5e1"/>
                    <path class="petal opacity-90" d="M100 115 C140 110 155 70 120 50 C100 65 90 95 100 115Z" fill="#e2e8f0" stroke="#cbd5e1"/>
                    
                    <!-- Kelopak Tengah -->
                    <path class="petal" d="M100 110 C70 100 65 55 90 45 C110 50 115 85 100 110Z" fill="#f8fafc" stroke="#cbd5e1"/>
                    <path class="petal" d="M100 110 C130 100 135 55 110 45 C90 50 85 85 100 110Z" fill="#ffffff" stroke="#e2e8f0"/>
                    
                    <!-- Kuncup/Pusat Mawar -->
                    <path class="petal-center" d="M100 90 C85 85 80 60 100 50 C120 60 115 85 100 90Z" fill="#ffffff" stroke="#cbd5e1"/>
                    <ellipse cx="100" cy="62" rx="12" ry="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
                    <path d="M96 60 C98 52 102 52 104 60 C102 66 98 66 96 60Z" fill="#f1f5f9"/>
                </g>
            </svg>
            <div class="rose-shadow"></div>
        </div>

        <!-- Kartu Pesan -->
        <div class="card">
            <span class="subtitle">Sebuah Pesan Singkat</span>
            <h1 class="title">Bukan Soal Janji Manis</h1>

            <div class="message-body" id="typewriterText">
                <!-- Teks dialirkan via script.js -->
            </div>

            <div class="divider"><span>🤍</span></div>

            <!-- Form Balasan WhatsApp -->
            <form id="replyForm" class="reply-form">
                <label for="replyMessage" class="form-label">Ada pesan atau perasaan yang mau kamu sampaikan?</label>
                <div class="input-wrapper">
                    <textarea 
                        id="replyMessage" 
                        rows="3" 
                        placeholder="Tulis balasanmu di sini..." 
                        required></textarea>
                </div>
                
                <button type="submit" class="btn-send">
                    <span>Kirim Balasan via WhatsApp</span>
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M1.101 21.757L23.8 12 1.101 2.243l.009 7.587L17 12 1.11 14.17z"/>
                    </svg>
                </button>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
